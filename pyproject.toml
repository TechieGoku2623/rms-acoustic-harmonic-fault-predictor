[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-acoustic-harmonic-fault-predictor"
version = "1.0.0"
description = "RMS Acoustic Harmonic Fault Predictor"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
rms-acoustic-harmonic-fault-predictor = "rms_acoustic_harmonic_fault_predictor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]
